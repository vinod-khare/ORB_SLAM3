%YAML:1.0

# Dataset paths (child paths may also be absolute)
data:
  root:  "../.data/tumvi/dataset-corridor1_512_16/mav0"
  left:  "cam0/data"
  right: "cam1/data"
  imu:   "imu0/data.csv"

# Kalibr camchain file providing intrinsics, distortion, resolution, cam0->cam1 and IMU->cam0 extrinsics
# (relative paths are resolved from this file)
calibration:
  file: "../.data/tumvi/dataset-corridor1_512_16/dso/camchain.yaml"

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# Camera frames per second 
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# IMU Parameters
#--------------------------------------------------------------------------------------------
IMU.NoiseGyro: 0.00016
IMU.NoiseAcc: 0.0028
IMU.GyroWalk: 0.000022
IMU.AccWalk: 0.00086
IMU.Frequency: 200.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500 # Tested with 1250

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# Keypoint detector (descriptors are always ORB): FAST (default), AGAST, GFTT, ORB, BRISK, SIFT, AKAZE
# FAST/AGAST use the grid thresholds above; ORB/BRISK use iniThFAST as their corner threshold.
ORBextractor.detector: "GFTT"

# Sparse LK temporal associations for monocular, stereo, and inertial tracking (0: off, 1: on)
Tracking.useOpticalFlow: 1

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
