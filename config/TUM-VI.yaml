%YAML:1.0

# Dataset paths (child paths may also be absolute)
data:
  root:  "../.data/tumvi/dataset-corridor1_512_16/mav0"
  left:  "cam0/data"
  right: "cam1/data"
  imu:   "imu0/data.csv"

# Kalibr camchain file providing intrinsics, distortion, resolution, cam0->cam1 and IMU->cam0 extrinsics
# (relative paths are resolved from this file)
calibration:
  file: "../.data/tumvi/dataset-corridor1_512_16/dso/camchain.yaml"
  imu_file: "../.data/tumvi/dataset-corridor1_512_16/dso/imu_config.yaml"

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# Camera frames per second 
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# Feature Parameters
#--------------------------------------------------------------------------------------------
# Place-recognition backend: 2 (DBoW2) or 3 (DBoW3); CLI --dbow_version overrides this.
dbow_version: 2

TODO: combine the following into a single "keypoint" section
keypoint_extractor:
  n_features: 1024
  scale_factor: 1.2
  n_levels: 8
  initial_threshold: 20
  minimum_threshold: 7

# FAST, AGAST, GFTT, ORB, BRISK, SIFT, AKAZE
keypoint_detector:
  type: "FAST"

# ORB, SIFT, BRISK; independent of the detector
keypoint_descriptor:
  type: "ORB"

# Flow-first tracking with descriptor recovery/keyframes (0: off, 1: on)
tracking:
  matcher: "flann" # brute_force or flann (LSH for binary descriptors, KD-tree for SIFT)
  use_optical_flow: 0

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
ground_truth:
  path: "../.data/tumvi/dataset-corridor1_512_16/mav0/mocap0/data.csv"
  visible: false

camera_trajectory:
  visible: true

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
